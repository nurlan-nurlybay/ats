paths:
  data_processed: data/processed
  cvs: data/cvs               # all CVs: Gmail-ingested + UI-uploaded (gitignored)
  vacancies: data/vacancies   # 8 production job ads
  index_dir: data/processed/index

models:
  semantic:
    name: BAAI/bge-m3
    embedding_dimension: 1024
    device: cuda
    max_seq_length: 8192
    batch_size: 8
    normalize_embeddings: true
  tfidf:
    max_features: 20000
    ngram_range: [1, 2]
    min_df: 2
  llm:
    provider: qwen
    model: qwen3.6-plus
    temperature: 0.0
    max_tokens: 1024
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1

matching:
  top_k: 5
  default_strategy: rrf
  llm:
    shortlist_size: 15      # how many candidates the retriever fetches before LLM rerank
    max_concurrent: 5       # semaphore cap on in-flight LLM calls (DashScope rate limit guard)
    timeout_seconds: 30     # per-call HTTP timeout
    retry_attempts: 3       # exponential backoff retries on 429 / 5xx / timeout

vector_store:
  index_type: pgvector
  dimension: 1024
